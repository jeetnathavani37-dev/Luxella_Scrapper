name: Remove Site Data

on:
  workflow_dispatch:
    inputs:
      site_name:
        description: 'Konsi site ka data hatana hai'
        required: true
      batch_size:
        description: 'Ek run mein kitne Shopify products delete karne hain'
        required: false
        default: '6000'

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Remove site data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SITE_NAME: ${{ github.event.inputs.site_name }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '6000' }}
        run: python remove_site_data.py
