name: Rephrase Descriptions

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Ek run mein kitni descriptions rephrase karni hain'
        required: false
        default: '700'
  schedule:
    - cron: '0 */12 * * *'

jobs:
  rephrase:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Rephrase descriptions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '700' }}
        run: python rephrase_descriptions.py
