name: Sync Shopify Prices & Stock

on:
  schedule:
    - cron: '30 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Ek run mein kitne products sync karne hain'
        required: false
        default: '300'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Sync prices and stock
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '300' }}
        run: python shopify_sync.py
