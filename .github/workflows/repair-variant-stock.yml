name: Repair Variant Stock (one-time)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = sirf dikhao (default), 0 = asli likho'
        required: false
        default: '1'
      limit:
        description: 'Sirf itne badalne wale products (0 = sab). Pehle 5, phir 500.'
        required: false
        default: '5'
      verify:
        description: 'Read-only jaanch: N random products (0 = off). Ye set ho to repair nahi chalta.'
        required: false
        default: '0'
      max_age_days:
        description: 'Isse purane scrape wale products ko bilkul mat chhoo (default 3 din)'
        required: false
        default: '3'

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Repair per-size stock
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # inputs env se (shell mein seedha ${{ }} nahi - GitHub ka safe tareeka)
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_VERIFY: ${{ github.event.inputs.verify }}
          IN_MAX_AGE: ${{ github.event.inputs.max_age_days }}
        run: |
          if [ "$IN_VERIFY" != "0" ]; then
            python repair_variant_stock.py --verify "$IN_VERIFY"
          elif [ "$IN_DRY_RUN" = "0" ]; then
            python repair_variant_stock.py --confirm --limit "$IN_LIMIT" --max-age-days "$IN_MAX_AGE"
          else
            python repair_variant_stock.py --max-age-days "$IN_MAX_AGE"
          fi

      - name: Upload backup and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: variant-stock-${{ github.run_id }}
          path: |
            variant_stock_before-*.jsonl
            variant_stock_plan.jsonl
            variant_stock_report.json
          if-no-files-found: ignore
          retention-days: 90
